name: Publish Covart price lists

on:
  workflow_dispatch:
  # Verify identifier automation whenever publication code is updated.
  push:
    branches: [main]
    paths:
      - "scripts/generate_price_lists.py"
      - "tests/**"
      - ".github/workflows/publish-price-lists.yml"
  pull_request:
    paths:
      - "scripts/generate_price_lists.py"
      - "tests/**"
      - ".github/workflows/publish-price-lists.yml"
  schedule:
    # 07:15 Europe/Zagreb: summer UTC+2, winter UTC+1.
    - cron: "15 5 * * *"
    - cron: "15 6 * * *"
    # Reserve daily publication at 07:35 Europe/Zagreb if the primary run is missed.
    - cron: "35 5 * * *"
    - cron: "35 6 * * *"
    # Last routine check before the statutory 11:00 publication deadline.
    - cron: "50 8 * * *"
    - cron: "50 9 * * *"

permissions:
  contents: write

concurrency:
  group: covart-price-list-publication
  cancel-in-progress: false

jobs:
  # Pull requests must never publish cjenici or edit historical archives.
  verify:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Run regression tests
        run: python3 -m unittest discover -s tests -v

  publish:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Test identifier generation safeguards
        run: python3 -m unittest discover -s tests -v

      - name: Generate and validate price lists
        env:
          SHOPIFY_SHOP: 6ffdpq-40.myshopify.com
          COVART_MBO: "98946498"
          SHOPIFY_ADMIN_ACCESS_TOKEN: ${{ secrets.SHOPIFY_ADMIN_ACCESS_TOKEN }}
          SHOPIFY_CLIENT_ID: ${{ secrets.SHOPIFY_CLIENT_ID }}
          SHOPIFY_CLIENT_SECRET: ${{ secrets.SHOPIFY_CLIENT_SECRET }}
          SHOPIFY_API_VERSION: "2026-07"
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
        run: python3 scripts/generate_price_lists.py

      - name: Commit publication
        shell: bash
        run: |
          git add -A current archive state.json
          if git diff --cached --quiet; then
            echo "No publication changes to commit."
            exit 0
          fi
          git config user.name "covart-cjenici-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "Publish Covart price lists $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          git push
